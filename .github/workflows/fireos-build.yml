name: Fire OS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Shell checks
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Python checks
        run: python3 -m py_compile scripts/*.py

      - name: Gradle wrapper validation
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Lint Fire OS debug build
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quickbars-fireos-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
