name: Fire OS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Shell checks
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Python checks
        run: python3 -m py_compile scripts/*.py

      - name: Gradle wrapper validation
        run: |
          test -x ./gradlew
          ./gradlew --version

      - name: Build and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quickbars-fireos-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
